services:
  api:
    environment:
      LLM_PROVIDER: ollama
      LLM_MODEL: qwen2.5:1.5b-instruct-q4_K_M
      OLLAMA_URL: http://ollama:11434
    depends_on:
      model-init:
        condition: service_completed_successfully
    command: [uv, run, --frozen, --no-sync, uvicorn, roamwise.cloud:app, --host, 0.0.0.0, --port, "8000"]
  ollama:
    image: ollama/ollama@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - llm-models:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 20
  model-init:
    image: ollama/ollama@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: [ollama]
    command: [pull, "qwen2.5:1.5b-instruct-q4_K_M"]
    depends_on:
      ollama:
        condition: service_healthy
  data-agent:
    profiles: [maintenance]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: [uv, run, --frozen, --no-sync, python, -m, roamwise.data_agent]
    environment:
      DATA_DIR: /data
      EVIDENCE_DIR: /evidence
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
    volumes:
      - data:/data
      - ./evidence:/evidence
volumes:
  llm-models:

