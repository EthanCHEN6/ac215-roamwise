steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/roamwise/app:${_TAG}', '-f', services/cloud/Dockerfile, '.']
images: ['${_REGION}-docker.pkg.dev/$PROJECT_ID/roamwise/app:${_TAG}']
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: us-central1
  _TAG: rag-v1
