limit_req_zone $binary_remote_addr zone=search:10m rate=2r/s;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    location = /api/search {
        limit_req zone=search burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_read_timeout 60s;
    }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 240s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
